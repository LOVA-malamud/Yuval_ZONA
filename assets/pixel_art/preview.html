<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CROWNFRONT pixel animation preview</title>
<style>body{background:#101e27;color:#d8e5dc;font:16px system-ui;margin:24px}h1{font-size:24px;color:#f3d58e}label{display:inline-block;margin:0 18px 14px 0}select,button{background:#263e4d;color:#fff;border:1px solid #92aeb8;padding:8px;font:inherit}canvas{max-width:100%;height:auto;image-rendering:pixelated;background:#14262e;border:1px solid #344552}p{max-width:850px;color:#92aeb8}</style>
<h1>CROWNFRONT · Original crisp medieval animation preview</h1><p>Eight directions, physical weapon handedness, independent footsteps and upper-body poses. This is an art loop; actual attacks use existing gameplay timing.</p>
<label>Action <select id="action"></select></label><label>Facing <select id="direction"></select></label><label>Team <select id="team"><option value="azure">Azure</option><option value="ember">Ember</option></select></label><label><input id="walk" type="checkbox" checked>Moving legs</label><button id="pause">Pause</button><label>Frame <input id="frame" type="range" min="0" max="5" value="0"></label>
<canvas width="1100" height="370" id="canvas"></canvas><p id="status">Loading original sprite atlases…</p>
<script>
const roles=['player','melee','ranged','tank','worker'],actions=['idle','attack','heavy','guard','guard_hit','dash','recovery','stun','heal','gather','carry','flee','deposit','death','spawn','bow_ready','windup','walk','flee_carry'],dirs=['E','SE','S','SW','W','NW','N','NE'];
const $=id=>document.getElementById(id),ctx=$('canvas').getContext('2d');ctx.imageSmoothingEnabled=false;
for(const a of actions)$('action').add(new Option(a,a));$('action').value='walk';for(let i=0;i<8;i++)$('direction').add(new Option(dirs[i],i));$('direction').value=1;
const images={},jobs=[];for(const role of roles)for(const team of ['azure','ember'])for(const part of ['body','legs']){let key=`${role}-${team}-${part}`,img=new Image();images[key]=img;jobs.push(new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(new Error('Unable to load '+key));}));img.src=key+'.png';}
let paused=false,frame=0,last=0;$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Play':'Pause';};$('frame').oninput=()=>{paused=true;frame=+$('frame').value;$('pause').textContent='Play';};
Promise.all(jobs).then(()=>{$('status').textContent='Original atlases loaded. Use the Godot preview or a live match to review impact timing.';requestAnimationFrame(draw);}).catch(e=>$('status').textContent=e.message);
function draw(now){if(!paused&&now-last>110){frame=(frame+1)%6;last=now;$('frame').value=frame;}ctx.fillStyle='#14262e';ctx.fillRect(0,0,1100,370);let dir=+$('direction').value,team=$('team').value,action=$('action').value;
roles.forEach((role,i)=>{const x=80+i*220,y=220,s=6;ctx.fillStyle='#080f16';ctx.fillRect(x-42,y+12,84,12);if(action!=='death')ctx.drawImage(images[`${role}-${team}-legs`],(dir*6+($('walk').checked?frame:0))*32,$('walk').checked?40:0,32,40,x-16*s,y-31*s,32*s,40*s);ctx.drawImage(images[`${role}-${team}-body`],(dir*6+frame)*32,actions.indexOf(action)*40,32,40,x-16*s,y-31*s,32*s,40*s);ctx.fillStyle='#f3d58e';ctx.font='18px system-ui';ctx.fillText(role.toUpperCase(),x-40,310);});requestAnimationFrame(draw);}
</script></html>
